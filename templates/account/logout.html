{% extends "base.html" %}
{% block title %}Log out{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-xl border border-rail bg-booth p-6 sm:p-8">
  <h1 class="text-4xl font-bold tracking-tight">Log out?</h1>
  <form method="post" action="{% url 'account_logout' %}" class="mt-6 flex gap-3">
    {% csrf_token %}
    <button type="submit" class="btn">Log out</button>
    <a href="{% url 'home' %}" class="btn-ghost">Stay logged in</a>
  </form>
</section>
{% endblock %}
